[project]
name = "p2p-ai-assistant"
version = "0.0.1"
description = "P2P AI Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "psycopg2-binary",
    "celery[redis]",
    "pydantic-settings",
    "openai",
    "httpx",
    "structlog",
    "streamlit",
    "python-multipart",
    "reportlab",
    "Pillow",
    "pdf2image",
    "pypdfium2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.domain",
    "app.ports",
    "app.adapters",
    "app.workflow",
    "app.workflow.core",
    "app.workflow.nodes",
    "app.workflow.utils",
    "app.llm",
    "app.api",
    "app.dashboard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
